name: 'Sonar Fork Analysis'
description: 'Sonar scan external forks of your project'
inputs:
  mode:
    description: >
      auto: analyse directly when sonar-token is set, otherwise prepare an
      artifact; on workflow_run, analyse the prepared artifact. direct, prepare
      and analyze force one of those steps.
    default: auto
  working-directory:
    description: 'Directory containing the Maven or Gradle build.'
    default: .
  build-tool:
    description: 'auto, maven or gradle.'
    default: auto
  build-arguments:
    description: 'Extra arguments for the build, one per line.'
    default: ''
  project-key:
    description: 'The project key assigned by Sonar.'
  sonar-organization:
    description: 'The Sonar organization, required by SonarQube Cloud.'
    default: ''
  sonar-host-url:
    description: 'The Sonar server.'
    default: https://sonarcloud.io
  sonar-token:
    description:
      'The Sonar token. Empty on pull requests from forks, which is what selects
      the fork path.'
    default: ''
  maven-plugin-version:
    description: 'Version of the Sonar Maven plugin.'
    default: 5.8.0.7211
  gradle-plugin-version:
    description:
      'Version of the Sonar Gradle plugin, used when the build does not apply it
      itself.'
    default: 7.5.0.8588
branding:
  icon: search
  color: blue
runs:
  using: node24
  main: dist/index.js
