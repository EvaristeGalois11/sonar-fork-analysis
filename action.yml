name: 'Sonar Fork Analysis'
description:
  'Sonar analysis, with coverage, for pull requests from forks, without exposing
  your Sonar token. For Maven, Gradle and more.'
inputs:
  mode:
    description: >
      auto: analyse directly when sonar-token is set, otherwise prepare an
      artifact; on workflow_run, analyse the prepared artifact. direct, prepare
      and analyze force one of those steps.
    default: auto
  working-directory:
    description: 'Directory containing the project.'
    default: .
  build-tool:
    description: 'auto, maven, gradle or scanner.'
    default: auto
  build-goals:
    description: >
      Maven goals or Gradle tasks to run before the analysis, one per line.
      Defaults to verify for Maven and check for Gradle. Not with scanner, where
      the action runs after your own build and test steps.
    default: ''
  build-arguments:
    description: >
      Extra build flags (not goals or tasks), one per line. In analyze mode
      they're passed to the Sonar scanner instead, for example
      -Dsonar.projectName=App. The scanner doesn't run in the checkout there, so
      use absolute paths.
    default: ''
  project-key:
    description: >
      The project key assigned by Sonar. The build and the analysis must use the
      same one: it also names the artifact that passes between them.
  sonar-organization:
    description: 'The Sonar organization, required by SonarQube Cloud.'
    default: ''
  sonar-host-url:
    description: >
      The Sonar server. Leave empty for SonarQube Cloud, or to use
      SONAR_HOST_URL. Direct analyses also fall back to the build's own
      sonar.host.url, analyze mode doesn't.
    default: ''
  sonar-token:
    description:
      'The Sonar token. Empty on pull requests from forks, which is what selects
      the fork path.'
    default: ''
  checkout:
    description: >
      Analyze mode: check out the analysed commit. Set to false to check out
      yourself, e.g. for submodules or LFS: the checkout must then be at that
      commit, with full history and without persisted credentials, and origin
      must be this repository, where Sonar looks for the base branch.
    default: 'true'
  github-token:
    description: >
      Token to download the prepared artifact and find the pull request, needing
      actions: read and pull-requests: read. With statuses: write, analyze mode
      also reports the analysis on the analysed commit, where the pull request
      shows it.
    default: ${{ github.token }}
branding:
  icon: search
  color: blue
runs:
  using: node24
  main: dist/index.js
  # Runs at the end of the job, even a cancelled one, to close a status left pending.
  post: dist/post.js
