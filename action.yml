name: 'Sonar Fork Analysis'
description: 'Sonar scan external forks of your project'
inputs:
  mode:
    description: >
      auto: analyse directly when sonar-token is set, otherwise prepare an
      artifact; on workflow_run, analyse the prepared artifact. direct, prepare
      and analyze force one of those steps.
    default: auto
  id:
    description: >
      Names the analysis when a workflow prepares more than one, e.g. one per
      project in a monorepo. Use the same id when analysing.
    default: ''
  working-directory:
    description: 'Directory containing the Maven or Gradle build.'
    default: .
  build-tool:
    description: 'auto, maven or gradle.'
    default: auto
  build-goals:
    description: >
      Maven goals or Gradle tasks to run before the analysis, one per line.
      Defaults to verify for Maven and check for Gradle.
    default: ''
  build-arguments:
    description: >
      Extra build flags (not goals or tasks), one per line. In analyze mode they
      go to the Sonar scanner instead, e.g. -Dsonar.projectName=App.
    default: ''
  project-key:
    description: 'The project key assigned by Sonar.'
  sonar-organization:
    description: 'The Sonar organization, required by SonarQube Cloud.'
    default: ''
  sonar-host-url:
    description: >
      The Sonar server. Leave empty for SonarQube Cloud, or to use
      SONAR_HOST_URL or the build's own sonar.host.url.
    default: ''
  sonar-token:
    description:
      'The Sonar token. Empty on pull requests from forks, which is what selects
      the fork path.'
    default: ''
  checkout:
    description: >
      Analyze mode: check out the analysed commit. Set to false to check out
      yourself, e.g. for submodules or LFS: the checkout must then be at that
      commit, with full history and without persisted credentials, and origin
      must be this repository, where Sonar looks for the base branch.
    default: 'true'
  github-token:
    description: >
      Token to download the prepared artifact and find the pull request, needing
      actions: read and pull-requests: read.
    default: ${{ github.token }}
branding:
  icon: search
  color: blue
runs:
  using: node24
  main: dist/index.js
