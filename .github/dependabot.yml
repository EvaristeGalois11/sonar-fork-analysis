version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'

  - package-ecosystem: 'maven'
    directory: '/fixtures/maven'
    schedule:
      interval: 'daily'

  - package-ecosystem: 'gradle'
    directory: '/fixtures/gradle'
    schedule:
      interval: 'daily'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    ignore:
      # Types must match the runtime in action.yml (node24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
