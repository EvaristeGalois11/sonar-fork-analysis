name: 'CI'
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  action:
    name: 'Test action'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@v7

      - name: 'Set up Node'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Typecheck'
        run: npm run typecheck

      - name: 'Test'
        run: npm test

      # The action runs from the committed dist/, so it must match the sources. Deleting it first
      # also catches stale files the build no longer produces.
      - name: 'Check dist is up to date'
        id: check-dist
        run: |
          rm -rf dist
          npm run build
          git add --intent-to-add dist
          git diff --exit-code dist/

      - name: 'Upload the expected dist'
        if: ${{ failure() && steps.check-dist.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  gradle-wrapper:
    name: 'Validate Gradle wrapper'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@v7

      # gradle-wrapper.jar is a binary nobody can review, and Gradle has no script-only wrapper.
      - name: 'Validate wrapper jar'
        uses: gradle/actions/wrapper-validation@v6
