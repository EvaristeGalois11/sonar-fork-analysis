name: 'CI'
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  action:
    name: 'Test action'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Sonar's blame needs the full history.
          fetch-depth: 0

      - name: 'Set up Node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Check format'
        run: npm run format:check

      - name: 'Lint'
        run: npm run lint

      # Unused code and dependencies, and packages from anywhere but the npm registry over HTTPS.
      - name: 'Check dependencies'
        run: npm run lint:deps

      - name: 'Validate workflows against the GitHub schema'
        run: npm run lint:workflows

      - name: 'Type-check'
        run: npm run typecheck

      - name: 'Test'
        run: npm test

      # This repository analysed by its own action, as the README sets it up: directly with the token,
      # through the Sonar workflow without it, on pull requests from forks and Dependabot.
      - name: 'Analyse with Sonar'
        uses: $/
        with:
          project-key: evaristegalois11_sonar-fork-analysis
          sonar-organization: evaristegalois11
          sonar-token: ${{ secrets.SONAR_TOKEN }}

      # The action runs from the committed dist/, so it must match the sources. The bundle starts
      # from an empty dist/, which also catches stale files the build no longer produces.
      - name: 'Check dist is up to date'
        id: check-dist
        run: |
          npm run bundle
          git add --intent-to-add dist
          git diff --exit-code --text dist/

      - name: 'Upload the expected dist'
        if: ${{ failure() && steps.check-dist.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Analyze's checks for case-insensitive file systems and Windows' aliases of .git, on the real ones.
  other-systems:
    name: 'Test on ${{ matrix.name }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Test'
        run: npm test -- --coverage=false

  gradle-wrapper:
    name: 'Validate Gradle wrapper'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gradle-wrapper.jar is a binary nobody can review, and Gradle has no script-only wrapper.
      - name: 'Validate wrapper jar'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  # Its token may write security events, so it runs nothing but the pinned zizmor action.
  zizmor:
    name: 'Audit workflows'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Audits the workflows and the action for security problems, such as v1's script injection.
      # Findings go to code scanning, next to CodeQL's, which fails pull requests on those above its
      # severity threshold.
      # Without a version, zizmor is the one this action release pins by digest, so Dependabot's
      # updates of the action update zizmor too.
      - name: 'Run zizmor'
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  # A third-party image with the Docker socket, so its token only reads.
  actionlint:
    name: 'Lint workflows'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run actionlint'
        uses: $/.github/actions/actionlint
