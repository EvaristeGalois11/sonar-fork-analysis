# Checks what the analysis assumes about the scanner against the real one: the CLI the action pins,
# and the engines SonarCloud and SonarQube serve, which change on Sonar's schedule, hence the weekly
# run, which also reports a newer CLI.
name: 'Scanner'
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner:
    name: 'Check against the real scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: 'Set up Java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: 'Install dependencies'
        run: npm ci

      # Keyed by what the engines are today, so a new engine is a new cache entry. The checks verify a
      # restored engine like a downloaded one; the CLI is never cached, so the action's installer always
      # checks its hash.
      - name: 'Identify the current engines'
        id: engines
        run: |
          cloud="$(curl -sfS https://api.sonarcloud.io/analysis/engine | jq -r .sha256)"
          latest="$(curl -sfS -o /dev/null -w '%{redirect_url}' https://github.com/SonarSource/sonarqube/releases/latest)"
          qube="${latest##*/}"
          [[ "$cloud" =~ ^[0-9a-f]{64}$ && "$qube" =~ ^[0-9.]+$ ]]
          echo "key=scanner-engines-$cloud-$qube" >> "$GITHUB_OUTPUT"

      - name: 'Restore the engines'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/engines
          key: ${{ steps.engines.outputs.key }}

      - name: 'Check against the real scanner'
        run: npm run test:scanner
        env:
          SCANNER_ENGINES: ${{ runner.temp }}/engines

      # Nothing else notices a new CLI, as the action pins it by hash. Not on pull requests, which a
      # release elsewhere shouldn't fail.
      - name: 'Check for a newer scanner CLI'
        if:
          github.event_name == 'schedule' || github.event_name ==
          'workflow_dispatch'
        run: npm run scanner:check
