name: 'CodeQL'
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '31 7 * * 3'
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    name: 'Analyze ${{ matrix.language }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # actions covers the workflow files, where injection bugs like v1's live.
        language: [javascript-typescript, actions]
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Initialize CodeQL'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - dist
              - fixtures

      - name: 'Perform CodeQL analysis'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
