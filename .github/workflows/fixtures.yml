# Analyses the test fixtures with the action as it is in this pull request.
#
# Must stay on 'pull_request', never 'pull_request_target': on fork pull requests GitHub withholds the
# Sonar token here, which is what keeps fork code away from it.
name: 'Fixtures'
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  direct:
    name: 'Analyse ${{ matrix.fixture }} directly'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [maven, gradle]
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Set up Java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: ${{ matrix.fixture }}

      - name: 'Analyse with Sonar'
        uses: ./
        with:
          mode: direct
          working-directory: fixtures/${{ matrix.fixture }}
          project-key:
            EvaristeGalois11_sonar-fork-analysis_${{ matrix.fixture }}_direct
          sonar-organization: evaristegalois
          sonar-token: ${{ secrets.SONAR_TOKEN }}
