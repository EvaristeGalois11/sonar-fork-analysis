# Builds the test fixtures and prepares their Sonar analysis, with no access to secrets.
#
# For a pull request from a fork this runs the contributor's code, so the job must stay
# unprivileged: it only uploads an artifact, which the 'Fixtures Sonar' workflow picks up.
name: 'Fixtures'
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  prepare:
    name: 'Prepare ${{ matrix.fixture }} analysis'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [maven, gradle]
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@v7

      - name: 'Set up Java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: ${{ matrix.fixture }}

      # The version under test: the action as it is in this pull request.
      - name: 'Prepare Sonar analysis'
        uses: ./
        with:
          id: ${{ matrix.fixture }}
          working-directory: fixtures/${{ matrix.fixture }}
