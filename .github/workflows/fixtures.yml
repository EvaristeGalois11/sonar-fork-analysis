# Builds the test fixtures and analyses them when the Sonar token is available.
#
# For a pull request from a fork GitHub withholds the secrets, so the action falls back to
# preparing an artifact that the 'Fixtures Sonar' workflow analyses afterwards. This job therefore
# stays unprivileged: it must use 'pull_request', never 'pull_request_target'.
name: 'Fixtures'
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  prepare:
    name: 'Build ${{ matrix.fixture }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: maven
            project-key: EvaristeGalois11_sonar-fork-analysis_maven
          - fixture: gradle
            project-key: EvaristeGalois11_sonar-fork-analysis_gradle
    steps:
      - name: 'Checkout project'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Sonar wants the history for blame information

      - name: 'Set up Java'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: ${{ matrix.fixture }}

      # The version under test: the action as it is in this pull request.
      - name: 'Analyse with Sonar'
        uses: ./
        with:
          id: ${{ matrix.fixture }}
          working-directory: fixtures/${{ matrix.fixture }}
          project-key: ${{ matrix.project-key }}
          sonar-organization: evaristegalois
          sonar-token: ${{ secrets.SONAR_TOKEN }}
