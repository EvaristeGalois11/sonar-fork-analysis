# The whole package, as many Node projects do, so the fork path must bring the coverage report and the
# type declarations into the sources.
sonar.sources=.
sonar.exclusions=test/**,coverage/**
sonar.tests=test
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Node's test runner can't load these files. No test can cover them.
sonar.coverage.exclusions=**/*.jsx
